      } else {

        if (state.orderType === 'delivery') {

      const wa = String(state.config.whatsapp).replace(/\D/g, "");
      window.open(`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`, "_blank");
    };

    window.shareMenu = function() {
      if (navigator.share) navigator.share({ title: state.config.name, url: location.href });
      else { navigator.clipboard?.writeText(location.href); alert("تم نسخ رابط المنيو"); }
    };

    window.openAdminModal = function() {
      document.getElementById("modalContainer").innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div class="bg-[#161616] border border-[#2E291E] w-full max-w-[440px] rounded-3xl p-5 space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="font-extrabold text-[#E2C06D]">إدارة المنيو وتصدير البيانات</h3>
              <button onclick="closeModal()" class="text-stone-400 hover:text-white text-xl">&times;</button>
            </div>
            <div class="space-y-3 text-xs">
              <div>
                <label class="text-stone-400 block mb-1">رقم واتساب استقبال الطلبات (بدون +)</label>
                <input id="admWa" type="text" value="${sanitize(state.config.whatsapp)}" class="w-full bg-[#0E0E0E] border border-[#2E291E] rounded-xl px-3 py-2 text-white">
              </div>
              <div class="flex gap-2">
                <button onclick="saveAdminSettings()" class="flex-1 py-2.5 rounded-xl gold-grad text-black font-extrabold">حفظ الإعدادات</button>
                <button onclick="exportExcel()" class="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white font-extrabold">تصدير Excel 📊</button>
              </div>
            </div>
          </div>
        </div>
      `;
    };

    window.saveAdminSettings = function() {
      state.config.whatsapp = document.getElementById("admWa").value.trim() || state.config.whatsapp;
      saveState();
      closeModal();
      alert("تم حفظ الإعدادات بنجاح");
    };

    window.exportExcel = function() {
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(state.items.map(i => ({
        "id": i.id, "القسم": i.cat, "اسم الصنف": i.name, "السعر": i.price, "متوفر": i.available ? "TRUE" : "FALSE"
      })));
      XLSX.utils.book_append_sheet(wb, ws, "المنيو");
      XLSX.writeFile(wb, "Al_Kaysar_Menu_v2.xlsx");
    };

    renderCategories();
    renderMenu();
    lucide.createIcons();
  </script>
</body>
</html>
